name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild manually, or from a Builder.io webhook (see README), to pick up new content.
  workflow_dispatch:
  repository_dispatch:
    types: [builder-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm test -- --watch=false

      - name: Build
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: SPA fallback for non-prerendered routes
        run: |
          cd dist/builder-angular-gen-2/browser
          cp index.csr.html 404.html
          touch .nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/builder-angular-gen-2/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
